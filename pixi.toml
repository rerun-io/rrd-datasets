# Pixi is a package management tool for developers.
# Before running a task, pixi ensures that all listed dependencies are installed first.
#
# https://pixi.sh/latest/
#
# Use `pixi task list` to list the available tasks,
# and `pixi run TASK` to run it.
#
# This is the single manifest of the whole repository: every example under
# examples/ registers a feature, two environments, and its dataset tasks here.
# Example pyproject.toml files hold package metadata only.

[workspace]
name = "rrd-datasets"
authors = ["rerun.io <opensource@rerun.io>"]
channels = ["conda-forge"]
description = "Python data conversion examples from open robotics datasets to the Rerun file format (.rrd)"
homepage = "https://rerun.io"
license = "MIT OR Apache-2.0"

# osx-64 dropped: rerun-sdk ships no Intel-mac wheel (only osx-arm64 / linux / win).
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]
readme = "README.md"
repository = "https://github.com/rerun-io/rrd-datasets"
requires-pixi = ">=0.73"
version = "0.1.0"


# ─── common: the shared example toolchain ────────────────────────────────────
# One Python and one rerun-sdk for every example, pinned exactly once so a
# version bump stays a one-line change. Example environments compose this feature.

[feature.common.dependencies]
python = "3.12.*"

[feature.common.pypi-dependencies]
# rerun-sdk is PyPI-only, and one version holds repo-wide. Pinned exact, not a
# wildcard: `.rrd` and `.rbl` output depends on the version, so a patch release
# arrives as a deliberate commit. The example pyprojects pin the same version —
# theirs is what the Modal images install.
rerun-sdk = "==0.36.1"
# The shared tools every example composes; not declared in example pyprojects —
# the Modal images ship its source instead (no index carries a path dependency).
rrd_datasets_common = { path = "packages/rrd_datasets_common", editable = true }

# The shared package's own dev environment: PACKAGE_DIR points the generic
# dev tasks (lint/typecheck/tests) at it, mirroring the example features.
[feature.common-package.dependencies]
# Type information for the cloud modules.
boto3-stubs = ">=1.34"
mypy-boto3-s3 = ">=1.34"

[feature.common-package.pypi-dependencies]
# The cloud extra's real dependencies, so common-dev type-checks and tests the
# modal_jobs modules; the example environments bring their own copies.
modal = ">=1,<2"
boto3 = ">=1.34"

[feature.common-package.activation.env]
PACKAGE_DIR = "packages/rrd_datasets_common"


# ─── dev: check tooling shared by the default and every -dev environment ─────

[feature.dev.dependencies]
python = "3.12.*"
mypy = "1.14.1.*"
ruff = "0.11.6.*"
pytest = ">=8"
typos = ">=1.16.20"
nbstripout = ">=0.9.1,<0.10"
actionlint = ">=1.7.7,<2"
lychee = "0.24.2.*"
prettier = ">=3.6"

[feature.dev.activation.env]
# The directory the generic tasks below operate on. Example features override
# this with their own directory; the default environment covers the repo root.
# List the example feature before dev in its environment — on conflicts, the
# first feature's activation.env wins.
PACKAGE_DIR = "."

# Generic per-package tasks, parameterized by $PACKAGE_DIR:

[feature.dev.tasks.py-fmt]
cmd = "cd $PACKAGE_DIR && ruff check --fix --config \"$PIXI_PROJECT_ROOT/pyproject.toml\" . && ruff format --config \"$PIXI_PROJECT_ROOT/pyproject.toml\" ."
description = "Auto-fix lint findings and format the package"

[feature.dev.tasks.py-fmt-check]
cmd = "cd $PACKAGE_DIR && ruff check --config \"$PIXI_PROJECT_ROOT/pyproject.toml\" . && ruff format --check --config \"$PIXI_PROJECT_ROOT/pyproject.toml\" ."
description = "Lint and format-check the package"

[feature.dev.tasks.py-lint]
# mypy does not search parent directories for config, so pass the root one explicitly.
# Stub packages (types-*) go into feature.dev dependencies, not --install-types:
# the env has no pip for mypy to call.
cmd = "cd $PACKAGE_DIR && mypy --config-file \"$PIXI_PROJECT_ROOT/.mypy.ini\" --no-warn-unused-ignore ."
description = "Type-check the package"

[feature.dev.tasks.tests]
# The explicit `tests` argument keeps collection inside the package; a bare
# `pytest` would fall back to the root config's testpaths.
cmd = "cd $PACKAGE_DIR && pytest -q tests"
description = "Run the package tests"

# Repo-wide static checks:

[feature.dev.tasks.lint-typos]
cmd = "typos"
description = "Check for typos"

[feature.dev.tasks.nb-strip]
cmd = "python scripts/nb_strip.py"
description = "Strip outputs from committed notebooks"

[feature.dev.tasks.nb-strip-check]
cmd = "python scripts/nb_strip.py --verify"
description = "Check that committed notebooks carry no outputs"

[feature.dev.tasks.lint-actions]
cmd = "actionlint"
description = "Lint the GitHub workflow files"

# Prettier walks the whole tree but skips everything in .gitignore (data/, rrds/, .pixi, …).
[feature.dev.tasks.format-md]
cmd = 'prettier --write "**/*.md"'
description = "Format the markdown files"

[feature.dev.tasks.check-md]
cmd = 'prettier --check "**/*.md"'
description = "Check markdown formatting"

[feature.dev.tasks.link-check]
# lychee reads lychee.toml at the repo root; the globs match CI's link workflow.
# --hidden reaches .github/.
cmd = 'lychee --hidden --cache --max-cache-age 1d --root-dir "$PIXI_PROJECT_ROOT" . "**/*.toml" "**/*.py" "**/*.yml"'
description = "Check links in text files"

# Each package type-checks and tests in its own dev environment, where its real
# dependencies are installed — no single environment holds every package's
# dependencies (per-example solve groups), so these fan out instead of running
# one repo-wide pass. New examples register here; CI just runs the aggregate.

[feature.dev.tasks.py-lint-all]
depends-on = [
    "py-lint",
    { task = "py-lint", environment = "common-dev" },
    { task = "py-lint", environment = "abc-dev" },
    { task = "py-lint", environment = "hiw-dev" },
    { task = "py-lint", environment = "libero-dev" },
]
description = "Type-check the repo root and every package"

[feature.dev.tasks.tests-all]
depends-on = [
    { task = "tests", environment = "common-dev" },
    { task = "tests", environment = "abc-dev" },
    { task = "tests", environment = "hiw-dev" },
    { task = "tests", environment = "libero-dev" },
]
description = "Run every package's tests"

[feature.dev.tasks.check-all]
# ruff needs no environment, so the root py-fmt-check already covers example code.
depends-on = [
    "py-fmt-check",
    "py-lint-all",
    "lint-typos",
    "nb-strip-check",
    "lint-actions",
    "check-md",
    "link-check",
    "tests-all",
]
description = "Run every repo check"


# ─── serve: one local catalog server shared by every example ─────────────────

[feature.serve-tasks.tasks.serve]
# One in-memory catalog holds every example's dataset: each *-register task
# adds its recordings as absolute URIs, so the server needs no particular
# working directory. The extra origin lets the notebook-embedded viewer
# connect from VS Code webviews; plain localhost Jupyter is allowed by default.
cmd = "rerun server --cors-allow-origin 'vscode-webview://*'"
description = "Serve a local Rerun catalog of the converted recordings"


# ═══════════════════════════════════════════════════════════════════════════
# abc-130k
# ═══════════════════════════════════════════════════════════════════════════

[feature.abc-130k.dependencies]
# PyAV from conda, so its native FFmpeg libraries come along on every platform.
av = ">=12"

# Notebook environment.
pandas = ">=2,<3"
ipykernel = ">=6.29,<7"
ipywidgets = ">=8.1.8,<9"

# Type information for the cloud extra.
boto3-stubs = ">=1.34"
mypy-boto3-s3 = ">=1.34"

[feature.abc-130k.pypi-dependencies]
abc_130k = { path = "examples/abc-130k", editable = true, extras = ["cloud"] }
# PyPI-only notebook integration; not required by the conversion package.
rerun-notebook = "==0.36.1"

[feature.abc-130k.activation.env]
PACKAGE_DIR = "examples/abc-130k"

# Dataset tasks sit in their own feature, included only in the abc environment.
# Every dataset names its stages the same way (download, convert, register, …),
# and the environment selects the dataset: `pixi run -e abc convert`.

[feature.abc-130k-tasks.tasks.demo]
cmd = "rerun rrds/abc-130k/base/*.rrd blueprints/abc-130k/default.rbl"
depends-on = ["download", "convert", "blueprint"]
description = "Download sample episodes, convert them, and open them in the Rerun Viewer"

[feature.abc-130k-tasks.tasks.download]
cmd = "python -m abc_130k.download"
cwd = "examples/abc-130k"
description = "Download the ABC-130k sample episodes"

[feature.abc-130k-tasks.tasks.convert]
cmd = "python -m abc_130k.convert --pass-through"
cwd = "examples/abc-130k"
description = "Convert ABC-130k episodes to rrd"

[feature.abc-130k-tasks.tasks.blueprint]
cmd = "python -m abc_130k.blueprint"
cwd = "examples/abc-130k"
description = "Generate the ABC-130k blueprint"

[feature.abc-130k-tasks.tasks.register]
cmd = "python -m abc_130k.catalog"
cwd = "examples/abc-130k"
description = "Register the ABC-130k recordings in a catalog"

[feature.abc-130k-tasks.tasks.convert-on-modal]
cmd = "modal run --detach -q -m abc_130k.modal_jobs.convert_episodes"
cwd = "examples/abc-130k"
description = "Convert ABC-130k episodes on Modal"

[feature.abc-130k-tasks.tasks.upload-blueprint]
cmd = "python -m abc_130k.upload_blueprint"
cwd = "examples/abc-130k"
description = "Upload the ABC-130k blueprint"



# ─── hiw-500 ──────────────────────────────────────────────────────────────────

[feature.hiw-500.dependencies]
# Native JPEG library behind pyturbojpeg, which needs major version 3. The
# Modal image installs the same version from the upstream .deb — see
# `LIBJPEG_TURBO_INSTALL` in `modal_jobs/convert_episodes.py`.
libjpeg-turbo = ">=3,<4"

# Type stubs for mypy (cloud extra + yaml calibration parsing).
boto3-stubs = ">=1.34"
mypy-boto3-s3 = ">=1.34"
types-pyyaml = ">=6"

[feature.hiw-500.pypi-dependencies]
hiw_500 = { path = "examples/hiw-500", editable = true, extras = ["cloud"] }

[feature.hiw-500.activation.env]
PACKAGE_DIR = "examples/hiw-500"
# This dataset converts into a HuggingFace bucket named after it, so the hiw environments pick
# that backend and bucket while `rrd_datasets_common` keeps its own `s3` default and placeholder
# buckets. `HF_NAMESPACE` stays the caller's: the bucket lives in their namespace.
# Keep the `${VAR:-default}` form. A literal value here would override a caller's own
# `STORAGE_BACKEND=s3`, since pixi's activation wins over the surrounding shell.
STORAGE_BACKEND = "${STORAGE_BACKEND:-hf}"
HF_BUCKET = "${HF_BUCKET:-hiw-500}"

# Test-only: writes and reads small MCAPs to check that camera messages round-trip.
[feature.hiw-500-dev.pypi-dependencies]
mcap = ">=1.2"
mcap-ros2-support = ">=0.5"

# Dataset tasks sit in their own feature, included only in the hiw environment.
# Every dataset names its stages the same way (download, convert, register, …),
# and the environment selects the dataset: `pixi run -e hiw convert`.

[feature.hiw-500-tasks.tasks.download]
cmd = "python -m hiw_500.download"
cwd = "examples/hiw-500"
description = "Download the HIW-500 sample episodes"

[feature.hiw-500-tasks.tasks.convert]
cmd = "python -m hiw_500.convert"
cwd = "examples/hiw-500"
description = "Convert HIW-500 episodes to rrd (every layer)"

[feature.hiw-500-tasks.tasks.convert-base]
cmd = "python -m hiw_500.base_layer"
cwd = "examples/hiw-500"
description = "Convert the HIW-500 base layer"

[feature.hiw-500-tasks.tasks.convert-urdf]
cmd = "python -m hiw_500.urdf_layer"
cwd = "examples/hiw-500"
description = "Convert the HIW-500 URDF layer"

[feature.hiw-500-tasks.tasks.convert-odom]
cmd = "python -m hiw_500.odom_layer"
cwd = "examples/hiw-500"
description = "Convert the HIW-500 odometry layer"

[feature.hiw-500-tasks.tasks.convert-cameras]
cmd = "python -m hiw_500.camera_layer"
cwd = "examples/hiw-500"
description = "Convert the HIW-500 camera layer"

[feature.hiw-500-tasks.tasks.convert-ir]
cmd = "python -m hiw_500.ir_layer"
cwd = "examples/hiw-500"
description = "Convert the HIW-500 wrist IR layer"

[feature.hiw-500-tasks.tasks.convert-properties]
cmd = "python -m hiw_500.properties_layer"
cwd = "examples/hiw-500"
description = "Convert the HIW-500 properties layer"

[feature.hiw-500-tasks.tasks.blueprint]
cmd = "python -m hiw_500.blueprint"
cwd = "examples/hiw-500"
description = "Generate the HIW-500 blueprint"

[feature.hiw-500-tasks.tasks.register]
cmd = "python -m hiw_500.catalog"
cwd = "examples/hiw-500"
description = "Register the HIW-500 recordings in a catalog"

[feature.hiw-500-tasks.tasks.convert-on-modal]
cmd = "modal run --detach -q -m hiw_500.modal_jobs.convert_episodes"
cwd = "examples/hiw-500"
description = "Convert HIW-500 episodes on Modal"

[feature.hiw-500-tasks.tasks.upload-blueprint]
cmd = "python -m hiw_500.upload_blueprint"
cwd = "examples/hiw-500"
description = "Upload the HIW-500 blueprint"


# ─── libero ───────────────────────────────────────────────────────────────────

[feature.libero.pypi-dependencies]
libero = { path = "examples/libero", editable = true }

[feature.libero.activation.env]
PACKAGE_DIR = "examples/libero"

# Dataset tasks sit in their own feature, included only in the libero environment.
# Every dataset names its stages the same way (download, convert, register, …),
# and the environment selects the dataset: `pixi run -e libero download`.

[feature.libero-tasks.tasks.download]
cmd = "python -m libero.download"
cwd = "examples/libero"
description = "Download the LIBERO sample task files"


[environments]
default = { features = ["dev"] }
serve = { features = ["common", "serve-tasks"], no-default-feature = true }
common-dev = { features = [
    "common",
    "common-package",
    "dev",
], no-default-feature = true }
# The example feature comes before dev: on activation.env conflicts the first
# feature wins, and PACKAGE_DIR must be the example's.
abc = { features = [
    "common",
    "abc-130k",
    "abc-130k-tasks",
], solve-group = "abc", no-default-feature = true }
abc-dev = { features = [
    "common",
    "abc-130k",
    "dev",
], solve-group = "abc", no-default-feature = true }
hiw = { features = [
    "common",
    "hiw-500",
    "hiw-500-tasks",
], solve-group = "hiw", no-default-feature = true }
hiw-dev = { features = [
    "common",
    "hiw-500",
    "hiw-500-dev",
    "dev",
], solve-group = "hiw", no-default-feature = true }
libero = { features = [
    "common",
    "libero",
    "libero-tasks",
], solve-group = "libero", no-default-feature = true }
libero-dev = { features = [
    "common",
    "libero",
    "dev",
], solve-group = "libero", no-default-feature = true }
