# Package metadata only — the workspace root pixi.toml owns environments,
# tasks, and lint configuration.

[project]
name = "molmoact2"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
description = "Convert the MolmoAct2 bimanual YAM episodes into layered Rerun recordings."
authors = [{ name = "Rerun.io", email = "opensource@rerun.io" }]
license = "MIT OR Apache-2.0"
readme = "README.md"
dependencies = [
    # Also the Modal image's installs: `image_from_pyproject` reads this list at build time.
    "rerun-sdk[catalog]==0.38.1",
    "pyarrow>=14",
    "numpy>=1.26",
    "huggingface_hub>=1.21.0,<2",
]

[project.urls]
Homepage = "https://rerun.io"
Repository = "https://github.com/rerun-io/rrd-datasets"

[project.optional-dependencies]
# Cloud (Modal/S3) flow only.
cloud = ["modal>=1,<2", "boto3>=1.34", "botocore>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["molmoact2"]

[tool.hatch.version]
path = "molmoact2/__init__.py"
variable = "__version__"
