# Package metadata only — the workspace root pixi.toml owns environments,
# tasks, and lint configuration.

[project]
name = "rrd_datasets_common"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
description = "Tools shared by the rrd-datasets examples."
authors = [{ name = "Rerun.io", email = "opensource@rerun.io" }]
license = "MIT OR Apache-2.0"
dependencies = [
    # hf_repo only; the cloud modules keep their heavier deps behind the extra.
    "huggingface_hub>=1,<2",
]

[project.optional-dependencies]
# The modal_jobs modules (Modal/S3 flow) only.
cloud = ["modal>=1,<2", "boto3>=1.34", "botocore>=1.34"]

[project.urls]
Homepage = "https://rerun.io"
Repository = "https://github.com/rerun-io/rrd-datasets"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rrd_datasets_common"]

[tool.hatch.version]
path = "rrd_datasets_common/__init__.py"
variable = "__version__"
