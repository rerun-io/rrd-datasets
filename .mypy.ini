[mypy]
python_version = 3.12
files = .
; Examples and the shared package type-check through their own dev environments,
; where their dependencies are installed.
exclude = ^(build|examples|packages)/
namespace_packages = True
show_error_codes = True
strict = True
enable_error_code = redundant-expr, truthy-bool, ignore-without-code
; plugins = numpy.typing.mypy_plugin
ignore_missing_imports = True
no_implicit_reexport = False
disallow_untyped_calls = False

; `mcap/writer.py` imports `.__init__`, which makes mypy see the package under two module names.
[mypy-mcap,mcap.*]
follow_imports = skip
